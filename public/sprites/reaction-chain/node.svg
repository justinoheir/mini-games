<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Glowing circle with inner dot -->
  <defs>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(96,165,250,0.15)"/>
      <stop offset="100%" stop-color="rgba(96,165,250,0)"/>
    </radialGradient>
    <radialGradient id="nodeCoreGrad" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="40" cy="40" r="40" fill="url(#nodeGrad)"/>
  <!-- Main circle -->
  <circle cx="40" cy="40" r="28" fill="url(#nodeCoreGrad)" stroke="rgba(147,197,253,0.7)" stroke-width="2"/>
  <!-- Inner dot -->
  <circle cx="40" cy="40" r="10" fill="#dbeafe" opacity="0.9"/>
  <circle cx="38" cy="38" r="4" fill="white"/>
</svg>