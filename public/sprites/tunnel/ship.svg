<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80">
  <!-- Triangle rocket/ship shape -->
  <defs>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Main body -->
  <polygon points="30,4 56,68 30,58 4,68" fill="url(#shipGrad)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Engine glow -->
  <ellipse cx="30" cy="64" rx="12" ry="5" fill="#f97316" opacity="0.9"/>
  <ellipse cx="30" cy="66" rx="7" ry="3" fill="#fbbf24"/>
  <!-- Window -->
  <circle cx="30" cy="38" r="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="28" cy="36" r="3" fill="rgba(255,255,255,0.4)"/>
  <!-- Side fins -->
  <polygon points="4,68 0,78 14,72" fill="#0284c7"/>
  <polygon points="56,68 60,78 46,72" fill="#0284c7"/>
</svg>