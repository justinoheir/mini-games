<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 6-arm snowflake -->
  <g stroke="#93c5fd" stroke-linecap="round" stroke-width="4" fill="none">
    <!-- 6 arms at 60° intervals -->
    <line x1="50" y1="8" x2="50" y2="92"/>
    <line x1="50" y1="8" x2="50" y2="92" transform="rotate(60,50,50)"/>
    <line x1="50" y1="8" x2="50" y2="92" transform="rotate(120,50,50)"/>
    <!-- Branch ticks on each arm -->
    <line x1="36" y1="25" x2="50" y2="35"/>
    <line x1="64" y1="25" x2="50" y2="35"/>
    <line x1="36" y1="75" x2="50" y2="65"/>
    <line x1="64" y1="75" x2="50" y2="65"/>
    <!-- Same on 60° arm -->
    <line x1="36" y1="25" x2="50" y2="35" transform="rotate(60,50,50)"/>
    <line x1="64" y1="25" x2="50" y2="35" transform="rotate(60,50,50)"/>
    <line x1="36" y1="75" x2="50" y2="65" transform="rotate(60,50,50)"/>
    <line x1="64" y1="75" x2="50" y2="65" transform="rotate(60,50,50)"/>
    <!-- Same on 120° arm -->
    <line x1="36" y1="25" x2="50" y2="35" transform="rotate(120,50,50)"/>
    <line x1="64" y1="25" x2="50" y2="35" transform="rotate(120,50,50)"/>
    <line x1="36" y1="75" x2="50" y2="65" transform="rotate(120,50,50)"/>
    <line x1="64" y1="75" x2="50" y2="65" transform="rotate(120,50,50)"/>
  </g>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#bfdbfe" stroke="#93c5fd" stroke-width="2"/>
</svg>