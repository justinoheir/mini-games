<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100">
  <!-- Icicle (pointing down) -->
  <defs>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bae6fd;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#e0f2fe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <path d="M8 0 L32 0 L20 95 Z" fill="url(#ice)" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Inner highlight -->
  <path d="M14 2 L24 2 L20 70 Z" fill="white" opacity="0.4"/>
</svg>
