<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Gift box with ribbon cross and bow -->
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Box body -->
  <rect x="8" y="42" width="84" height="62" rx="5" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Box lid -->
  <rect x="4" y="28" width="92" height="20" rx="5" fill="url(#lidGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Vertical ribbon on box -->
  <rect x="45" y="42" width="10" height="62" fill="#fbbf24" opacity="0.9"/>
  <!-- Horizontal ribbon on box -->
  <rect x="8" y="64" width="84" height="10" fill="#fbbf24" opacity="0.9"/>
  <!-- Vertical ribbon on lid -->
  <rect x="45" y="28" width="10" height="20" fill="#f59e0b"/>
  <!-- Horizontal ribbon on lid -->
  <rect x="4" y="35" width="92" height="6" fill="#f59e0b"/>
  <!-- Bow loops -->
  <ellipse cx="36" cy="22" rx="18" ry="10" fill="#fbbf24" transform="rotate(-25,36,22)" stroke="#f59e0b" stroke-width="1"/>
  <ellipse cx="64" cy="22" rx="18" ry="10" fill="#fbbf24" transform="rotate(25,64,22)" stroke="#f59e0b" stroke-width="1"/>
  <!-- Bow center knot -->
  <circle cx="50" cy="24" r="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
</svg>