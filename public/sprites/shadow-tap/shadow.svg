<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark radial gradient circle (shadow target) -->
  <defs>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,15,30,0.95)"/>
      <stop offset="60%" stop-color="rgba(10,10,20,0.8)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#shadowGrad)"/>
  <!-- Subtle inner ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(100,100,150,0.2)" stroke-width="2"/>
</svg>