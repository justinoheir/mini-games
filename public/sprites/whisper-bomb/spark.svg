    50,5  53,38  68,14  55,44
    88,28  58,50  95,50  62,55
    88,72  58,58  68,86  53,62
    50,95  47,62  32,86  45,58
    12,72  42,55  5,50  38,50
    12,28  45,44  32,14  47,38"
    fill="url(#sparkGrad)"/>
  <circle cx="50" cy="50" r="14" fill="#fff" opacity="0.9"/>
</svg>