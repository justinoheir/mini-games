<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Black bomb with fuse spiral -->
  <defs>
    <radialGradient id="bombGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
  </defs>
  <!-- Fuse spiral -->
  <path d="M 55,18 C 60,10 72,8 74,16 C 76,24 66,28 68,20 C 70,14 78,16 76,24"
    fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Fuse tip spark -->
  <circle cx="76" cy="24" r="4" fill="#fbbf24"/>
  <circle cx="77" cy="23" r="2" fill="white"/>
  <!-- Bomb body -->
  <circle cx="50" cy="62" r="42" fill="url(#bombGrad)" stroke="#222" stroke-width="2"/>
  <!-- Bomb shine -->
  <ellipse cx="35" cy="46" rx="12" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-20,35,46)"/>
  <!-- Band on top -->
  <rect x="42" y="20" width="16" height="10" rx="3" fill="#444"/>
</svg>