<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Golf hole - dark circle with flag -->
  <defs>
    <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="60%" stop-color="#2d1500"/>
      <stop offset="100%" stop-color="#3d2000"/>
    </radialGradient>
  </defs>
  <!-- Hole -->
  <circle cx="50" cy="68" r="28" fill="url(#holeGrad)"/>
  <ellipse cx="50" cy="68" rx="28" ry="10" fill="#0d0700" opacity="0.7"/>
  <!-- Flag pole -->
  <line x1="50" y1="40" x2="50" y2="10" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="50,10 82,20 50,30" fill="#ef4444"/>
  <!-- Ground rim -->
  <ellipse cx="50" cy="68" rx="30" ry="8" fill="none" stroke="#5a3a00" stroke-width="2"/>
</svg>