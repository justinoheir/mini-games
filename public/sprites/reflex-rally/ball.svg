<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tennis ball - yellow with white curved line -->
  <defs>
    <radialGradient id="tennisGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8f535"/>
      <stop offset="100%" stop-color="#b8c410"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#tennisGrad)"/>
  <!-- White seam curves -->
  <path d="M 22 35 Q 50 55 22 72" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <path d="M 78 35 Q 50 55 78 72" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Shine -->
  <ellipse cx="36" cy="30" rx="10" ry="7" fill="rgba(255,255,255,0.4)" transform="rotate(-15,36,30)"/>
</svg>