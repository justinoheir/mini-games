<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 120">
  <!-- Vertical meter bar -->
  <defs>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Background track -->
  <rect x="4" y="4" width="22" height="112" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Fill (represents current level - top 70%) -->
  <rect x="6" y="38" width="18" height="76" rx="4" fill="url(#meterGrad)"/>
  <!-- Tick marks -->
  <line x1="22" y1="40" x2="26" y2="40" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="22" y1="60" x2="26" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="22" y1="80" x2="26" y2="80" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="22" y1="100" x2="26" y2="100" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <!-- Shine -->
  <rect x="7" y="40" width="5" height="74" rx="3" fill="rgba(255,255,255,0.2)"/>
</svg>