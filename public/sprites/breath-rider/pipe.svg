<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200">
  <!-- Green pipe like Flappy Bird -->
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <!-- Pipe body -->
  <rect x="5" y="0" width="50" height="200" fill="url(#pipeGrad)"/>
  <!-- Cap (wider at top) -->
  <rect x="0" y="0" width="60" height="24" rx="4" fill="url(#capGrad)"/>
  <!-- Inner shadow -->
  <rect x="38" y="0" width="10" height="200" fill="rgba(0,0,0,0.15)"/>
  <rect x="38" y="0" width="10" height="24" rx="2" fill="rgba(0,0,0,0.15)"/>
</svg>