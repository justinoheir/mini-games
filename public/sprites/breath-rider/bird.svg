<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Simple bird: oval body + triangle beak + arc wings -->
  <defs>
    <radialGradient id="birdGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <!-- Wings (arcs behind body) -->
  <path d="M 20,40 Q 5,15 30,25" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 80,40 Q 95,15 70,25" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="50" cy="40" rx="30" ry="22" fill="url(#birdGrad)"/>
  <!-- Tail -->
  <polygon points="22,40 8,30 8,52" fill="#d97706"/>
  <!-- Beak -->
  <polygon points="78,36 95,40 78,44" fill="#fb923c"/>
  <!-- Eye -->
  <circle cx="68" cy="36" r="5" fill="white"/>
  <circle cx="69" cy="36" r="3" fill="#1a0a00"/>
  <circle cx="70" cy="35" r="1" fill="white"/>
  <!-- Body shine -->
  <ellipse cx="42" cy="30" rx="10" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(-15,42,30)"/>
</svg>