<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Goal frame - white rectangular posts and crossbar -->
  <!-- Net grid -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none">
    <line x1="10" y1="10" x2="10" y2="95"/>
    <line x1="30" y1="10" x2="30" y2="95"/>
    <line x1="50" y1="10" x2="50" y2="95"/>
    <line x1="70" y1="10" x2="70" y2="95"/>
    <line x1="90" y1="10" x2="90" y2="95"/>
    <line x1="110" y1="10" x2="110" y2="95"/>
    <line x1="130" y1="10" x2="130" y2="95"/>
    <line x1="150" y1="10" x2="150" y2="95"/>
    <line x1="170" y1="10" x2="170" y2="95"/>
    <line x1="190" y1="10" x2="190" y2="95"/>
    <line x1="4" y1="25" x2="196" y2="25"/>
    <line x1="4" y1="45" x2="196" y2="45"/>
    <line x1="4" y1="65" x2="196" y2="65"/>
    <line x1="4" y1="85" x2="196" y2="85"/>
  </g>
  <!-- Posts and crossbar -->
  <rect x="2" y="5" width="6" height="90" rx="2" fill="white"/>
  <rect x="192" y="5" width="6" height="90" rx="2" fill="white"/>
  <rect x="2" y="5" width="196" height="6" rx="2" fill="white"/>
</svg>